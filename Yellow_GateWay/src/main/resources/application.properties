spring.application.name=Yellow_GateWay

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

auth.jwt.secret=${JWT_SECRET:Yellow-local-development-secret-change-me-123456}

spring.cloud.gateway.server.webflux.routes[0].id=YellowDoc
spring.cloud.gateway.server.webflux.routes[0].uri=lb://Yellow
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/docs/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=Yellow
spring.cloud.gateway.server.webflux.routes[0].uri=lb://YellowDoc
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**






